# Nginx configuration for SMP Shard Admin Panel
# This config assumes Next.js is running on localhost:3000
# 
# IMPORTANT: Next.js is configured with trailingSlash: true
# This means all URLs should have trailing slashes to prevent redirect loops

server {
    listen 80;
    listen [::]:80;
    server_name v1rtopia.com;

    # Redirect HTTP to HTTPS (uncomment if using SSL)
    # return 301 https://$server_name$request_uri;
    
    # Admin panel location - matches basePath '/apanel44'
    # Note: trailing slash handling is critical here
    location = /apanel44 {
        # Redirect to trailing slash to match Next.js trailingSlash: true
        return 301 /apanel44/;
    }
    
    location /apanel44/ {
        # Proxy to Next.js server
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support (needed for hot reload in dev, useful for production features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Don't cache responses (can be adjusted for specific routes)
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable automatic trailing slash redirects by nginx
        # Let Next.js handle routing
        proxy_redirect off;
    }
    
    # Static files for Next.js (_next/static/) with caching
    # These files are immutable and can be cached aggressively
    location /apanel44/_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache static files for 1 year (Next.js uses content hashing)
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Disable trailing slash redirects for static files
        proxy_redirect off;
    }
    
    # Public static files (images, fonts, etc.)
    location /apanel44/public/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache public files for a shorter period
        expires 7d;
        add_header Cache-Control "public";
        
        proxy_redirect off;
    }
}

